services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dreamhome
      POSTGRES_PASSWORD: dreamhome
      POSTGRES_DB: dreamhome
    ports:
      - "5433:5432"
    volumes:
      - dreamhome_pg_data:/var/lib/postgresql/data

volumes:
  dreamhome_pg_data:
