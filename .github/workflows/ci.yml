name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PNPM_VERSION: 10

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @dreamhome/api exec prisma generate

      # All three lint steps below are continue-on-error: this workflow was added after the
      # codebase already existed, and eslint/prettier were never actually enforced up to this
      # point — apps/api alone has 3000+ pre-existing formatting violations (its actual style is
      # double-quoted strings; its lint config expects single-quoted). Fixing that is a large,
      # separate reformatting task, not something to do as a side effect of adding CI. Flip these
      # off once the backlog is cleared.
      - name: Lint API
        run: pnpm --filter @dreamhome/api lint
        continue-on-error: true

      - name: Lint web
        run: pnpm --filter @dreamhome/web lint
        continue-on-error: true # apps/web/src/lib/auth-context.tsx has one pre-existing react-hooks/set-state-in-effect error

      - name: Lint website
        run: pnpm --filter @dreamhome/website lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @dreamhome/api exec prisma generate

      - name: Typecheck API
        run: pnpm --filter @dreamhome/api exec tsc --noEmit -p tsconfig.build.json

      - name: Typecheck web
        run: pnpm --filter @dreamhome/web exec tsc --noEmit

      - name: Typecheck website
        run: pnpm --filter @dreamhome/website exec tsc --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @dreamhome/api exec prisma generate

      # Unit tests only — every Prisma call is mocked (see apps/api/src/test-utils/prisma-mock.ts),
      # so no Postgres service container is needed here.
      - name: Test API
        run: pnpm --filter @dreamhome/api test

      - name: Test web
        run: pnpm --filter @dreamhome/web test

      - name: Test website
        run: pnpm --filter @dreamhome/website test

  build:
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @dreamhome/api exec prisma generate

      - name: Build API
        run: pnpm --filter @dreamhome/api build

      - name: Build web
        run: pnpm --filter @dreamhome/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

      - name: Build website
        run: pnpm --filter @dreamhome/website build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
